server:
  port: 8080
  servlet:
    context-path: /tengo-sso-server

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sso_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-idle: 16
        min-idle: 8
        max-active: 32
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

tengo:
  sso:
    enabled: true
    token-expire: 30
    refresh-token-expire: 604800
    algorithm: HS256
    # ⚠️ 生产环境必须通过环境变量 TENGOSSO_XKEY 和 TENGOSSO_RKEY 注入强密钥（≥32字符）
    # 以下为开发环境示例值，禁止用于生产
    x-key: dev-only-do-not-use-in-production-change-me-now-2024
    r-key: dev-only-do-not-use-in-production-change-me-refresh-2024
    server-url: http://localhost:8080/tengo-sso-server
    # CORS 允许的客户端源（逗号分隔），生产环境应精确指定
    allowed-origins: http://localhost:8081

logging:
  level:
    com.tengo: DEBUG
    org.springframework.security: WARN
mybatis:
  configuration:
    map-underscore-to-camel-case: true