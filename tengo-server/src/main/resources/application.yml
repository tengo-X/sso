server:
  port: 8080
  servlet:
    context-path: /tengo-sso-server

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sso_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-idle: 16
        min-idle: 8
        max-active: 32
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

tengo:
  sso:
    token-expire: 1800
    refresh-token-expire: 86400

logging:
  level:
    com.tengo: DEBUG
    org.springframework.security: WARN
mybatis:
  configuration:
    map-underscore-to-camel-case: true